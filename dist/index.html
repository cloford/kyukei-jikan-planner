<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f4">
  <meta name="description" content="1日の案件間に取れる休憩時間を、スマートフォンの時間軸で算出します。">
  <title>休憩時間算出アプリ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <section class="planner" aria-label="休憩時間算出アプリ">
      <div class="control-strip">
        <div class="control-actions">
          <button id="addButton" class="action-button primary" type="button">＋ 案件追加</button>
          <button id="jobsButton" class="action-button" type="button">案件一覧 <span id="jobCount" class="count-badge">0</span></button>
          <button id="undoButton" class="action-button" type="button" disabled>↶ 元に戻す</button>
          <button id="resetButton" class="action-button danger" type="button">リセット</button>
          <button id="settingsButton" class="action-button settings-button" type="button" aria-label="休憩案の設定" title="休憩案の設定">⚙</button>
        </div>
      </div>

      <div id="summary" class="compact-summary" aria-live="polite"></div>
      <div id="outsideNotice" class="outside-notice" hidden></div>
      <div id="editBanner" class="edit-banner" hidden>
        <span id="editInstruction"></span>
        <button id="cancelEditButton" type="button">キャンセル</button>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div id="timeline" class="timeline" aria-label="06:00から21:00までの時間軸">
        <div id="rulerLayer" class="ruler-layer" aria-hidden="true"></div>
        <div id="timelineLane" class="timeline-lane" aria-label="案件と休憩を表示する時間軸">
          <div id="breakLayer" class="break-layer"></div>
          <div id="jobLayer" class="job-layer"></div>
          <div id="timeLabelLayer" class="time-label-layer" aria-hidden="true"></div>
          <div id="ghostLayer" class="ghost-layer"></div>
          <div id="pointerGuide" class="pointer-guide" hidden><span id="guideTime"></span></div>
        </div>
      </div>
      <div id="dragReadout" class="drag-readout" hidden></div>
      <div class="axis-footer"><span>06:00–21:00</span><span><i class="legend-swatch job"></i>案件 <i class="legend-swatch break"></i>休憩</span></div>
    </section>
  </main>

  <dialog id="jobsSheet" class="bottom-sheet" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading"><div><h2 id="sheetTitle">案件一覧</h2><p>時刻の直接入力と削除ができます</p></div><button id="closeSheetButton" class="close-button" type="button" aria-label="案件一覧を閉じる">×</button></div>
    <label class="sheet-date">日付を切り替える <input id="dateInput" type="date" aria-label="案件の日付を切り替える"></label>
    <div id="jobList" class="sheet-list"></div>
    <button id="sheetAddButton" class="sheet-add" type="button">＋ 時間軸で案件を追加</button>
  </dialog>

  <dialog id="settingsDialog" class="confirm-dialog settings-dialog" aria-labelledby="settingsTitle">
    <div class="sheet-heading"><h2 id="settingsTitle">休憩案の設定</h2><button id="closeSettingsButton" class="close-button" type="button" aria-label="設定を閉じる">×</button></div>
    <label class="setting-field" for="minBreakSelect">1回あたりの最短時間</label>
    <select id="minBreakSelect" aria-label="1回あたりの最短時間">
      <option value="10">10分</option><option value="15">15分</option><option value="20">20分</option>
      <option value="25">25分</option><option value="30" selected>30分</option><option value="35">35分</option><option value="40">40分</option>
    </select>
    <p>変更すると、保存済みの案件を使って休憩案を再計算します。</p>
  </dialog>

  <dialog id="resetDialog" class="confirm-dialog" aria-labelledby="resetTitle">
    <h2 id="resetTitle">この日の案件をリセットしますか？</h2>
    <p>この日の案件と休憩結果を消します。他の日付の保存データには影響しません。実行後は「元に戻す」で復元できます。</p>
    <div class="confirm-actions"><button id="cancelResetButton" type="button">キャンセル</button><button id="confirmResetButton" type="button">リセットする</button></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
